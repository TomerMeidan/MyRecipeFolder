name: Nightly database backup

on:
  schedule:
    - cron: "30 0 * * *" # 00:30 UTC
  workflow_dispatch: # "Run workflow" button, for a test or an extra backup

permissions: {} # needs nothing from the repository

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the secrets, restricted to main, so a workflow edited on another branch can't read them.
    environment: backup
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 rejects the newer default checksums of the AWS CLI.
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BUCKET: myrecipefolder-backups
    steps:
      - name: Dump the database
        run: |
          # pg_dump must be at least the server's major version; the runner's own client is older.
          docker run --rm -e BACKUP_DATABASE_URL -v "$PWD:/out" postgres:17 \
            sh -c 'pg_dump "$BACKUP_DATABASE_URL" -Fc -n public -f /out/backup.dump'

      - name: Check the file is a complete backup
        run: |
          docker run --rm -v "$PWD:/out" postgres:17 pg_restore --list /out/backup.dump > contents.txt
          grep -q 'TABLE DATA public recipes' contents.txt
          echo "$(grep -c 'TABLE DATA' contents.txt) tables, $(wc -c < backup.dump) bytes"

      - name: Upload to R2 and check the stored copy
        run: |
          name="myrecipefolder-$(date -u +%Y-%m-%d_%H%M).dump"
          aws s3 cp backup.dump "s3://$BUCKET/$name" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          aws s3 cp "s3://$BUCKET/$name" stored.dump --endpoint-url "$R2_ENDPOINT" --only-show-errors
          cmp backup.dump stored.dump
          echo "Uploaded $name"

      # Runs after the upload, so a false alarm from a recipe saved mid-backup can't lose the file.
      - name: Restore into a scratch database and compare with live
        run: |
          docker run -d --name scratch -e POSTGRES_HOST_AUTH_METHOD=trust -v "$PWD:/out" postgres:17
          # Over TCP: during init the image's temporary server only answers on the socket.
          until docker exec scratch pg_isready -q -h 127.0.0.1 -U postgres; do sleep 1; done
          docker exec scratch psql -q -U postgres -c 'DROP SCHEMA public'
          # Only tables and rows: foreign keys and RLS policies need Supabase's auth schema.
          docker exec scratch pg_restore -U postgres -d postgres --no-owner --no-privileges --exit-on-error \
            --section=pre-data --section=data /out/backup.dump
          # Counts and whole-table hashes only, because this repository's logs are public.
          export q="SELECT 'recipes', count(*), md5(string_agg(t::text, E'\n' ORDER BY id COLLATE \"C\")) FROM public.recipes t
            UNION ALL SELECT 'ingredients', count(*), md5(string_agg(t::text, E'\n' ORDER BY id COLLATE \"C\")) FROM public.ingredients t
            UNION ALL SELECT 'steps', count(*), md5(string_agg(t::text, E'\n' ORDER BY recipe_id COLLATE \"C\", order_num)) FROM public.steps t"
          docker run --rm -e BACKUP_DATABASE_URL -e q postgres:17 sh -c 'psql "$BACKUP_DATABASE_URL" -Atc "$q"' > live.txt
          docker exec -e q scratch sh -c 'psql -U postgres -Atc "$q"' > restored.txt
          cat restored.txt
          diff live.txt restored.txt
          echo "Restored backup matches the live data"
